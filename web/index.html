<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f5f5f7;color:#1d1d1f}
header{background:#1d1d1f;color:#fff;padding:20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.header-content{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header h1{font-size:24px;font-weight:700}
.buscador{flex:1;min-width:200px}
.buscador input{width:100%;padding:12px 16px;border:none;border-radius:8px;font-size:15px;background:#fff;color:#1d1d1f}
.filtros{max-width:1400px;margin:0 auto;padding:15px 20px;display:flex;gap:10px;flex-wrap:wrap;overflow-x:auto}
.filtros button{padding:8px 18px;border:1px solid #d2d2d7;background:#fff;border-radius:20px;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .15s;font-weight:500}
.filtros button:hover{background:#e5e5e7}
.filtros button.activo{background:#0071e3;color:#fff;border-color:#0071e3}
main{max-width:1400px;margin:0 auto;padding:20px}
.contador{color:#86868b;font-size:14px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.producto{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.producto:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.producto img{width:100%;height:200px;object-fit:contain;background:#f9f9f9;padding:12px}
.producto .info{padding:14px;flex:1;display:flex;flex-direction:column}
.producto .nombre{font-weight:600;font-size:14px;color:#1d1d1f;margin-bottom:8px;line-height:1.3;min-height:38px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.producto .tipo{font-size:11px;color:#86868b;text-transform:uppercase;margin-bottom:8px;letter-spacing:0.5px}
.producto .precio{font-size:26px;font-weight:700;color:#0071e3;margin-bottom:12px}
.producto .btn-ws{display:block;text-align:center;padding:12px;background:#25d366;color:#fff;text-decoration:none;font-size:14px;font-weight:700;border-radius:10px;margin-top:auto;transition:background .15s}
.producto .btn-ws:hover{background:#1da851}
.sin-resultados{text-align:center;padding:80px 20px;color:#86868b;font-size:16px}
footer{background:#1d1d1f;color:#86868b;text-align:center;padding:30px 20px;margin-top:40px;font-size:13px}
@media(max-width:600px){
  header h1{font-size:20px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .producto img{height:150px}
  .producto .precio{font-size:20px}
  .producto .nombre{font-size:13px}
}
</style>
</head>
<body>
<header>
  <div class="header-content">
    <h1>Catálogo</h1>
    <div class="buscador">
      <input type="text" id="buscar" placeholder="Buscar producto..." autocomplete="off">
    </div>
  </div>
</header>
<div class="filtros" id="filtros"></div>
<main>
  <div class="contador" id="contador"></div>
  <div class="grid" id="grid"></div>
  <div class="sin-resultados" id="sin-resultados" style="display:none">
    No se encontraron productos.
  </div>
</main>
<footer>
  <p>Consultá por WhatsApp para confirmar stock y coordinar la compra.</p>
</footer>
<script>
const WHATSAPP_NUMERO = "5491100000000"; // <-- CAMBIAR POR TU NUMERO
let catalogo = [];
let filtroTipo = "";
let busqueda = "";

function formatearPrecio(p) {
  return "$" + p.toLocaleString("es-AR", {maximumFractionDigits: 0});
}

function renderFiltros() {
  const tipos = [...new Set(catalogo.map(p => p.tipo).filter(t => t))].sort();
  const cont = document.getElementById("filtros");
  let html = '<button class="activo" data-tipo="">Todos</button>';
  for (const t of tipos) {
    html += `<button data-tipo="${t}">${t}</button>`;
  }
  cont.innerHTML = html;
  cont.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      cont.querySelectorAll("button").forEach(b => b.classList.remove("activo"));
      btn.classList.add("activo");
      filtroTipo = btn.dataset.tipo;
      render();
    });
  });
}

function render() {
  const grid = document.getElementById("grid");
  const contador = document.getElementById("contador");
  const sinRes = document.getElementById("sin-resultados");

  let filtrados = catalogo.filter(p => {
    if (filtroTipo && p.tipo !== filtroTipo) return false;
    if (busqueda && !p.producto.toLowerCase().includes(busqueda)) return false;
    return true;
  });

  contador.textContent = `${filtrados.length} productos`;

  if (filtrados.length === 0) {
    grid.innerHTML = "";
    sinRes.style.display = "block";
    return;
  }
  sinRes.style.display = "none";

  grid.innerHTML = filtrados.map(p => {
    const mensaje = encodeURIComponent(`Hola, me interesa: ${p.producto} (${formatearPrecio(p.precio_venta)})`);
    const wsUrl = `https://wa.me/${WHATSAPP_NUMERO}?text=${mensaje}`;
    const desc = p.descripcion ? p.descripcion.substring(0, 100) + (p.descripcion.length > 100 ? '...' : '') : '';
    return `
      <div class="producto">
        <img src="${p.imagen || ''}" alt="${p.producto}" loading="lazy" onerror="this.style.display='none'">
        <div class="info">
          <div class="nombre">${p.producto}</div>
          <div class="tipo">${p.tipo || 'general'}</div>
          <div class="precio">${formatearPrecio(p.precio_venta)}</div>
          <a href="${wsUrl}" target="_blank" class="btn-ws">Consultar por WhatsApp</a>
        </div>
      </div>
    `;
  }).join("");
}

document.getElementById("buscar").addEventListener("input", e => {
  busqueda = e.target.value.toLowerCase().trim();
  render();
});

fetch("catalogo.json")
  .then(r => r.json())
  .then(data => {
    catalogo = data;
    renderFiltros();
    render();
  })
  .catch(err => {
    document.getElementById("grid").innerHTML = `<div class="sin-resultados">Error al cargar el catálogo: ${err.message}</div>`;
  });
</script>
</body>
</html>
