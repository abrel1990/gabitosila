<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Gimport</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<meta name="theme-color" content="#0a1128">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif; background:#0a1128; color:#fff; overflow-x:hidden}
header{padding:16px; background:rgba(10,17,40,0.9); border-bottom:1px solid #1e2d5a; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100}
.logo {display:flex; align-items:center; gap:0; text-decoration:none;}
.logo img {height:40px;}
.logo span {font-family:'Outfit'; font-size:24px; font-weight:800; background:linear-gradient(90deg,#3b82f6,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px; padding:20px; max-width:1400px; margin:0 auto;}
.producto{background:#111b3d; border-radius:16px; padding:12px; border:1px solid #1e2d5a;}
.producto img{width:100%; height:200px; object-fit:cover; border-radius:12px; background:#fff; cursor:pointer;}
.producto h3{font-size:16px; margin:10px 0 5px; font-family:'Outfit';}
.producto .precio{font-size:24px; font-weight:800; background:linear-gradient(90deg,#3b82f6,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:10px;}
.acciones{display:flex; gap:8px; flex-wrap:wrap;}
.btn-ws{flex:1; background:#25d366; color:#fff; text-align:center; padding:10px; border-radius:8px; text-decoration:none; font-weight:600;}
.btn-cart{flex:1; background:#ef4444; color:#fff; text-align:center; padding:10px; border-radius:8px; font-weight:600; border:none; cursor:pointer;}
.btn-compartir{flex:0 0 40px; background:#1e2d5a; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:16px;}
/* Modales y Carrito simplificados */
.carrito-panel{position:fixed; top:0; right:-100%; width:100%; max-width:400px; height:100vh; background:#111b3d; z-index:1000; transition:0.3s; padding:20px; box-shadow:-5px 0 20px rgba(0,0,0,0.5)}
.carrito-panel.abierto{right:0}
.overlay{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999}
.overlay.abierto{display:block}
.carrito-item{display:flex; gap:10px; margin-bottom:15px; border-bottom:1px solid #1e2d5a; padding-bottom:10px;}
.carrito-item img{width:50px; height:50px; object-fit:cover; border-radius:8px;}
.carrito-item .info{flex:1;}
.btn-cerrar{position:absolute; top:20px; right:20px; background:none; border:none; color:#fff; font-size:24px; cursor:pointer;}
.total-box{margin-top:20px; font-size:20px; font-weight:800; display:flex; justify-content:space-between;}
.btn-final{display:block; width:100%; background:#25d366; color:#fff; text-align:center; padding:15px; border-radius:8px; text-decoration:none; font-weight:800; margin-top:15px;}
</style>
</head>
<body>

<header>
  <a href="./" class="logo">
    <img src="icono-192.png" alt="G">
    <span>Import</span>
  </a>
  <button onclick="abrirCarrito()" style="background:none; border:none; color:#fff; font-size:24px; position:relative;">
    🛒 <span id="badge" style="position:absolute; top:-5px; right:-10px; background:#ef4444; font-size:12px; padding:2px 6px; border-radius:10px; display:none;">0</span>
  </button>
</header>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay" onclick="cerrarCarrito()"></div>
<div class="carrito-panel" id="carrito-panel">
  <button class="btn-cerrar" onclick="cerrarCarrito()">×</button>
  <h2>Tu Carrito</h2>
  <div id="carrito-items" style="margin-top:20px; max-height:60vh; overflow-y:auto;"></div>
  <div class="total-box"><span>Total:</span> <span id="total">$0</span></div>
  <a href="#" id="btn-ws-carrito" class="btn-final" target="_blank">Consultar por WhatsApp</a>
</div>

<script>
const WA_VENTAS = "5491133550182";
let catalogo = [];
let carrito = JSON.parse(localStorage.getItem('carrito') || '[]');

// 1. Detectar si el cliente viene del link de un afiliado (?ref=Mari)
const urlParams = new URLSearchParams(window.location.search);
const afiliado = urlParams.get('ref');
if(afiliado) localStorage.setItem('vengo_de', afiliado);

// 2. Códigos de Proveedores Ocultos
function getCodigoProveedor(nombre) {
    const n = nombre.toUpperCase();
    if(n.includes("GLOBAL ONCE")) return "GLO";
    if(n.includes("IMPORTADORA ELECTRO")) return "ELE";
    if(n.includes("MZ STORE")) return "MZ";
    if(n.includes("TECNO")) return "TEC";
    if(n.includes("CASA MEDILEN")) return "MED";
    return null;
}

function limpiarNombre(nombre) {
    return nombre.replace(/- Comprar en Global Once/gi, '').replace(/- Importadora 11/gi, '').replace(/- Importadora Electro/gi, '').trim();
}

function formatPrecio(p) { return "$" + Math.round(p).toLocaleString("es-AR"); }

// 3. Renderizar Productos
fetch("catalogo.json?v=" + Date.now())
  .then(r => r.json())
  .then(data => {
    catalogo = data;
    const grid = document.getElementById('grid');
    
    grid.innerHTML = catalogo.map((p, i) => {
        const nombreLimpio = limpiarNombre(p.producto);
        const cod = getCodigoProveedor(p.producto);
        const codFinal = cod ? `${cod}-${i}` : `#${i}`;
        
        // Link para el botón de WhatsApp individual (oculto al cliente)
        const msj = `Hola, me interesa: ${nombreLimpio} [Cod: ${codFinal}] (${formatPrecio(p.precio_venta)})`;
        const wsLink = `https://wa.me/${WA_VENTAS}?text=${encodeURIComponent(msj)}`;
        
        return `
        <div class="producto">
            <img src="${p.imagen}" alt="${nombreLimpio}" onclick="abrirLightbox(${i})">
            <h3>${nombreLimpio}</h3>
            <div class="precio">${formatPrecio(p.precio_venta)}</div>
            <div class="acciones">
                <a href="${wsLink}" target="_blank" class="btn-ws">WhatsApp</a>
                <button class="btn-cart" onclick="agregarAlCarrito(${i})">+ Carrito</button>
                <button class="btn-compartir" onclick="compartirProducto(${i})">📤</button>
            </div>
        </div>`;
    }).join('');
    
    actualizarCarritoUI();
  });

// 4. Compartir (Sistema de Afiliados con Página con Foto)
function compartirProducto(idx) {
  const p = catalogo[idx];
  let nombreAfiliado = localStorage.getItem('afiliado_nombre');
  
  if (!nombreAfiliado) {
    nombreAfiliado = prompt("¿Cuál es tu nombre? (Para saber que vos recomendás)");
    if (!nombreAfiliado) return;
    localStorage.setItem('afiliado_nombre', nombreAfiliado.trim());
  }
  
  // Creamos el link hacia la página del producto (que tiene la foto)
  const slug = p.producto.toLowerCase().replace(/[^a-z0-9]+/g, '-').substring(0, 50) + "-" + idx;
  const linkCompartir = `https://abrel1990.github.io/gabitosila/productos/${slug}.html?ref=${encodeURIComponent(nombreAfiliado)}`;
  
  const msj = `🔥 ¡Mirá este producto en Gimport!\n\n📦 ${limpiarNombre(p.producto)}\n💵 Precio: ${formatPrecio(p.precio_venta)}\n\n👉 Compralo acá: ${linkCompartir}`;
  
  window.open(`https://wa.me/?text=${encodeURIComponent(msj)}`, '_blank');
}

// 5. Carrito
function agregarAlCarrito(idx) {
    const p = catalogo[idx];
    const cod = getCodigoProveedor(p.producto);
    const codFinal = cod ? `${cod}-${idx}` : `#${idx}`;
    
    const existe = carrito.find(x => x.idx === idx);
    if(existe) existe.cantidad++;
    else carrito.push({ idx, nombre: limpiarNombre(p.producto), codigo: codFinal, precio: p.precio_venta, imagen: p.imagen, cantidad: 1 });
    
    guardarCarrito();
}

function actualizarCarritoUI() {
    localStorage.setItem('carrito', JSON.stringify(carrito));
    const badge = document.getElementById('badge');
    const totalItems = carrito.reduce((s, i) => s + i.cantidad, 0);
    badge.style.display = totalItems > 0 ? 'inline' : 'none';
    badge.innerText = totalItems;

    const cont = document.getElementById('carrito-items');
    let total = 0, msj = "Hola, quiero consultar por:\n\n";
    
    cont.innerHTML = carrito.map((item, i) => {
        total += item.precio * item.cantidad;
        msj += `• ${item.nombre} [Cod: ${item.codigo}] (${item.cantidad}x ${formatPrecio(item.precio)})\n`;
        return `<div class="carrito-item">
            <img src="${item.imagen}">
            <div class="info"><strong>${item.nombre}</strong><br><span style="color:#8b5cf6">${formatPrecio(item.precio)} x ${item.cantidad}</span></div>
            <button onclick="quitarDelCarrito(${i})" style="background:none;border:none;color:#ef4444;font-size:20px;">×</button>
        </div>`;
    }).join('') || '<p>El carrito está vacío.</p>';

    document.getElementById('total').innerText = formatPrecio(total);
    
    // Inyectar código de afiliado en el mensaje del carrito si existe
    const vengoDe = localStorage.getItem('vengo_de');
    if(vengoDe) msj += `\n[Vengo de parte de: ${vengoDe}]`;
    
    msj += `\n*Total: ${formatPrecio(total)}*`;
    document.getElementById('btn-ws-carrito').href = `https://wa.me/${WA_VENTAS}?text=${encodeURIComponent(msj)}`;
}

function quitarDelCarrito(i) { carrito.splice(i, 1); actualizarCarritoUI(); }
function abrirCarrito() { document.getElementById('carrito-panel').classList.add('abierto'); document.getElementById('overlay').classList.add('abierto'); }
function cerrarCarrito() { document.getElementById('carrito-panel').classList.remove('abierto'); document.getElementById('overlay').classList.remove('abierto'); }

</script>
</body>
</html>
