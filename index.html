<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Gimport - Catálogo</title>
<script>
  (function() {
    var tema = localStorage.getItem('tema');
    if (!tema) {
      tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
    }
    document.documentElement.setAttribute('data-tema', tema);
  })();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

:root[data-tema="claro"] {
  --bg: #f0f2f5;
  --card-bg: #ffffff;
  --texto: #1d1d1f;
  --texto-suave: #6e6e73;
  --header-bg: #1d1d1f;
  --header-texto: #ffffff;
  --input-bg: #2c2c2e;
  --input-texto: #ffffff;
  --filtro-bg: #ffffff;
  --filtro-borde: #d2d2d7;
  --filtro-texto: #1d1d1f;
  --img-bg: #f9f9f9;
  --sombra: rgba(0,0,0,.08);
  --sombra-hover: rgba(0,0,0,.16);
  --footer-bg: #1d1d1f;
  --footer-texto: #98989d;
  --neon-1: #00f5ff;
  --neon-2: #ff00e5;
  --neon-3: #00ff88;
  --neon-4: #ffcc00;
  --neon-glow: 0 0 20px rgba(0,245,255,.6), 0 0 40px rgba(255,0,229,.3);
}
:root[data-tema="oscuro"] {
  --bg: #0a0a0f;
  --card-bg: #16161f;
  --texto: #f5f5f7;
  --texto-suave: #98989d;
  --header-bg: #0a0a0f;
  --header-texto: #f5f5f7;
  --input-bg: #1f1f2a;
  --input-texto: #ffffff;
  --filtro-bg: #1f1f2a;
  --filtro-borde: #2c2c3a;
  --filtro-texto: #f5f5f7;
  --img-bg: #1f1f2a;
  --sombra: rgba(0,0,0,.5);
  --sombra-hover: rgba(0,245,255,.2);
  --footer-bg: #0a0a0f;
  --footer-texto: #98989d;
  --neon-1: #00f5ff;
  --neon-2: #ff00e5;
  --neon-3: #00ff88;
  --neon-4: #ffcc00;
  --neon-glow: 0 0 20px rgba(0,245,255,.8), 0 0 40px rgba(255,0,229,.5);
}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--texto);min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s;overflow-x:hidden}

/* HEADER */
header{background:var(--header-bg);color:var(--header-texto);padding:18px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,245,255,.15);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--neon-1),var(--neon-2),var(--neon-3)) 1;transition:background .3s}
.header-content{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:42px;font-weight:900;letter-spacing:-2px;color:var(--header-texto);text-decoration:none;flex-shrink:0;background:linear-gradient(90deg,var(--neon-1),var(--neon-2),var(--neon-3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 0 30px rgba(0,245,255,.3);line-height:1;padding:4px 0}
.buscador{flex:1;min-width:200px}
.buscador input{width:100%;padding:14px 20px;border:2px solid var(--filtro-borde);border-radius:30px;font-size:16px;background:var(--input-bg);color:var(--input-texto);outline:none;transition:all .2s}
.buscador input:focus{border-color:var(--neon-1);box-shadow:0 0 15px rgba(0,245,255,.4)}
.buscador input::placeholder{color:#86868b}

/* BOTONES HEADER */
.btn-icon{background:var(--input-bg);border:2px solid var(--filtro-borde);border-radius:50%;width:48px;height:48px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .2s;flex-shrink:0;color:var(--header-texto);position:relative}
.btn-icon:hover{border-color:var(--neon-1);box-shadow:0 0 15px rgba(0,245,255,.5);transform:scale(1.05)}
.btn-icon:active{transform:scale(0.95)}

/* CARRITO BADGE */
.carrito-badge{position:absolute;top:-6px;right:-6px;background:var(--neon-2);color:#fff;font-size:12px;font-weight:800;border-radius:50%;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 15px rgba(255,0,229,.7);border:2px solid var(--header-bg)}

/* MENU FILTROS DESPLEGABLE */
.filtros-wrapper{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn-filtros{background:linear-gradient(135deg,var(--neon-1),var(--neon-2));color:#fff;border:none;padding:10px 20px;border-radius:25px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;box-shadow:0 0 15px rgba(0,245,255,.4)}
.btn-filtros:hover{transform:scale(1.05);box-shadow:0 0 25px rgba(0,245,255,.6)}
.btn-filtros.activo-tipo{background:linear-gradient(135deg,var(--neon-3),var(--neon-1))}
.filtros-dropdown{display:none;position:absolute;top:100%;left:20px;background:var(--card-bg);border:2px solid var(--neon-1);border-radius:14px;padding:14px;box-shadow:0 10px 40px rgba(0,245,255,.3);z-index:99;min-width:220px;max-height:400px;overflow-y:auto;margin-top:6px}
.filtros-dropdown.abierto{display:block}
.filtros-dropdown button{display:block;width:100%;padding:10px 14px;margin-bottom:6px;background:transparent;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--texto);text-align:left;transition:all .15s}
.filtros-dropdown button:hover{background:var(--filtro-bg)}
.filtros-dropdown button.activo{background:linear-gradient(135deg,var(--neon-1),var(--neon-2));color:#fff}
.filtros-pos{position:relative}

/* MAIN */
main{max-width:1400px;margin:0 auto;padding:16px 20px 20px;flex:1;width:100%}
.contador{color:var(--texto-suave);font-size:14px;margin-bottom:16px;font-weight:600}

/* GRILLA */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}

/* TARJETA */
.producto{background:var(--card-bg);border-radius:18px;overflow:hidden;box-shadow:0 4px 20px var(--sombra);transition:all .3s;display:flex;flex-direction:column;border:1px solid var(--filtro-borde);position:relative}
.producto:hover{transform:translateY(-6px);box-shadow:0 12px 40px var(--sombra-hover);border-color:var(--neon-1)}
.producto .img-wrap{width:100%;background:var(--img-bg);position:relative;padding-top:100%;overflow:hidden;cursor:pointer}
.producto .img-wrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;padding:14px;transition:transform .4s}
.producto:hover .img-wrap img{transform:scale(1.08)}
.producto .info{padding:16px;flex:1;display:flex;flex-direction:column}
.producto .nombre{font-weight:800;font-size:15px;color:var(--texto);margin-bottom:8px;line-height:1.35;min-height:42px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.producto .tipo{font-size:11px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:700}
.producto .precio{font-size:30px;font-weight:900;background:linear-gradient(135deg,var(--neon-1),var(--neon-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:14px;letter-spacing:-1px}
.producto .acciones{display:flex;gap:8px;margin-top:auto}
.producto .btn-ws{flex:1;text-align:center;padding:12px;background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;text-decoration:none;font-size:13px;font-weight:800;border-radius:12px;transition:all .2s;box-shadow:0 4px 15px rgba(37,211,102,.4);display:flex;align-items:center;justify-content:center;gap:4px;border:none;cursor:pointer;font-family:inherit}
.producto .btn-ws:hover{transform:scale(1.05);box-shadow:0 6px 25px rgba(37,211,102,.6)}
.producto .btn-agregar{flex:1;text-align:center;padding:12px;background:linear-gradient(135deg,var(--neon-2),#8b00ff);color:#fff;font-size:13px;font-weight:800;border-radius:12px;transition:all .2s;box-shadow:0 4px 15px rgba(255,0,229,.4);display:flex;align-items:center;justify-content:center;gap:4px;border:none;cursor:pointer;font-family:inherit}
.producto .btn-agregar:hover{transform:scale(1.05);box-shadow:0 6px 25px rgba(255,0,229,.6)}
.producto .btn-agregar.agregado{background:linear-gradient(135deg,var(--neon-3),#00aa55)}
.producto .descripcion{font-size:12px;color:var(--texto-suave);margin-bottom:10px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* SIN RESULTADOS */
.sin-resultados{text-align:center;padding:80px 20px;color:var(--texto-suave);font-size:16px}

/* FOOTER */
footer{background:var(--footer-bg);color:var(--footer-texto);padding:30px 20px;margin-top:40px;text-align:center;font-size:13px;line-height:1.8;border-top:2px solid transparent;border-image:linear-gradient(90deg,var(--neon-1),var(--neon-2),var(--neon-3)) 1}
footer .footer-brand{font-weight:900;font-size:22px;margin-bottom:8px;background:linear-gradient(90deg,var(--neon-1),var(--neon-2),var(--neon-3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
footer .footer-copy{margin-top:10px;font-size:12px}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:1000;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox.abierto{display:flex}
.lightbox img{max-width:95vw;max-height:85vh;object-fit:contain;border-radius:12px;box-shadow:0 0 60px rgba(0,245,255,.4)}
.lightbox .cerrar{position:absolute;top:20px;right:20px;background:var(--neon-2);color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:24px;cursor:pointer;box-shadow:0 0 20px rgba(255,0,229,.6);font-weight:700}
.lightbox .info{position:absolute;bottom:20px;left:20px;right:20px;text-align:center;color:#fff}
.lightbox .info .nombre-lb{font-size:20px;font-weight:800;margin-bottom:8px}
.lightbox .info .precio-lb{font-size:28px;font-weight:900;background:linear-gradient(90deg,var(--neon-1),var(--neon-2),var(--neon-3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lightbox .info .desc-lb{font-size:14px;color:#ccc;margin-top:10px;max-width:600px;margin-left:auto;margin-right:auto}

/* CARRITO PANEL */
.carrito-panel{display:none;position:fixed;top:0;right:0;width:100%;max-width:420px;height:100vh;background:var(--card-bg);z-index:1001;box-shadow:-10px 0 40px rgba(0,245,255,.3);flex-direction:column;border-left:2px solid var(--neon-1)}
.carrito-panel.abierto{display:flex}
.carrito-header{padding:20px;background:var(--header-bg);color:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--neon-1)}
.carrito-header h2{font-size:20px;font-weight:900;background:linear-gradient(90deg,var(--neon-1),var(--neon-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.carrito-cerrar{background:var(--neon-2);color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;font-weight:700}
.carrito-items{flex:1;overflow-y:auto;padding:16px}
.carrito-vacio{text-align:center;color:var(--texto-suave);padding:40px 20px;font-size:15px}
.carrito-item{display:flex;gap:12px;padding:12px;background:var(--bg);border-radius:12px;margin-bottom:10px;border:1px solid var(--filtro-borde);align-items:center}
.carrito-item img{width:60px;height:60px;object-fit:contain;border-radius:8px;background:var(--img-bg);padding:4px;flex-shrink:0}
.carrito-item .detalle{flex:1;min-width:0}
.carrito-item .det-nombre{font-size:12px;font-weight:700;color:var(--texto);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3;margin-bottom:4px}
.carrito-item .det-precio{font-size:14px;font-weight:800;color:var(--neon-1)}
.carrito-item .quitar{background:#ff3b30;color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;font-weight:700;flex-shrink:0}
.carrito-footer{padding:20px;background:var(--header-bg);border-top:2px solid var(--neon-1)}
.carrito-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:#fff}
.carrito-total .label{font-size:14px;font-weight:600;color:var(--footer-texto)}
.carrito-total .monto{font-size:28px;font-weight:900;background:linear-gradient(90deg,var(--neon-1),var(--neon-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.carrito-ws{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;text-align:center;border-radius:14px;font-size:16px;font-weight:900;text-decoration:none;box-shadow:0 4px 20px rgba(37,211,102,.5);border:none;cursor:pointer;font-family:inherit}
.carrito-ws:hover{transform:scale(1.02)}

/* OVERLAY */
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:1000;backdrop-filter:blur(4px)}
.overlay.abierto{display:block}

/* MOBILE */
@media(max-width:900px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .logo{font-size:36px}
}
@media(max-width:600px){
  header{padding:14px 14px}
  .header-content{gap:10px}
  .logo{font-size:34px}
  .buscador{min-width:100%;order:3;flex-basis:100%}
  .buscador input{padding:12px 18px;font-size:16px}
  .btn-icon{width:44px;height:44px;font-size:20px}
  .filtros-wrapper{padding:10px 14px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .producto{border-radius:14px}
  .producto .img-wrap{padding-top:110%}
  .producto .img-wrap img{padding:8px}
  .producto .info{padding:10px}
  .producto .nombre{font-size:12px;min-height:34px;margin-bottom:4px}
  .producto .tipo{font-size:9px;margin-bottom:6px}
  .producto .precio{font-size:22px;margin-bottom:8px}
  .producto .btn-ws,.producto .btn-agregar{padding:10px 4px;font-size:11px;border-radius:10px}
  .producto .acciones{flex-direction:column;gap:6px}
  .contador{font-size:12px;margin-bottom:10px}
  .carrito-panel{max-width:100%}
  footer{padding:24px 16px;font-size:12px}
  .filtros-dropdown{left:14px;right:14px;min-width:auto}
}
@media(max-width:380px){
  .logo{font-size:30px}
  .producto .precio{font-size:20px}
  .producto .nombre{font-size:11px;min-height:30px}
}
</style>
</head>
<body>
<header>
  <div class="header-content">
    <a href="/" class="logo">Gimport</a>
    <div class="buscador">
      <input type="text" id="buscar" placeholder="Buscar productos..." autocomplete="off">
    </div>
    <button class="btn-icon" id="btn-tema" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
    <button class="btn-icon" id="btn-carrito" title="Ver carrito" aria-label="Ver carrito">
      🛒<span class="carrito-badge" id="carrito-badge" style="display:none">0</span>
    </button>
  </div>
</header>
<div class="filtros-wrapper">
  <div class="filtros-pos">
    <button class="btn-filtros" id="btn-filtros">☰ Filtros <span id="filtro-activo-txt" style="opacity:.8"></span></button>
    <div class="filtros-dropdown" id="filtros-dropdown"></div>
  </div>
</div>
<main>
  <div class="contador" id="contador"></div>
  <div class="grid" id="grid"></div>
  <div class="sin-resultados" id="sin-resultados" style="display:none">
    No se encontraron productos.
  </div>
</main>
<footer>
  <div class="footer-brand">Gimport</div>
  <p>Consultá por WhatsApp para confirmar stock y coordinar la compra.</p>
  <p class="footer-copy">© 2026 Gabitosila · Todos los derechos reservados</p>
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="cerrar" id="lb-cerrar">×</button>
  <img id="lb-img" src="" alt="">
  <div class="info">
    <div class="nombre-lb" id="lb-nombre"></div>
    <div class="precio-lb" id="lb-precio"></div>
    <div class="desc-lb" id="lb-desc"></div>
  </div>
</div>

<!-- CARRITO -->
<div class="overlay" id="overlay"></div>
<div class="carrito-panel" id="carrito-panel">
  <div class="carrito-header">
    <h2>🛒 Tu carrito</h2>
    <button class="carrito-cerrar" id="carrito-cerrar">×</button>
  </div>
  <div class="carrito-items" id="carrito-items"></div>
  <div class="carrito-footer">
    <div class="carrito-total">
      <span class="label">Total:</span>
      <span class="monto" id="carrito-total">$0</span>
    </div>
    <a href="#" class="carrito-ws" id="carrito-ws" target="_blank">Consultar todo por WhatsApp</a>
  </div>
</div>

<script>
const WHATSAPP_NUMERO = "5491100000000"; // <-- CAMBIAR POR TU NUMERO
let catalogo = [];
let filtroTipo = "";
let busqueda = "";
let carrito = JSON.parse(localStorage.getItem('carrito') || '[]');

// TEMA
const btnTema = document.getElementById('btn-tema');
function actualizarIconoTema() {
  const tema = document.documentElement.getAttribute('data-tema');
  btnTema.textContent = tema === 'oscuro' ? '☀️' : '🌙';
}
actualizarIconoTema();
btnTema.addEventListener('click', () => {
  const actual = document.documentElement.getAttribute('data-tema');
  const nuevo = actual === 'oscuro' ? 'claro' : 'oscuro';
  document.documentElement.setAttribute('data-tema', nuevo);
  localStorage.setItem('tema', nuevo);
  actualizarIconoTema();
});

// PRECIO FORMATEADO
function formatearPrecio(p) {
  return "$" + Math.round(p).toLocaleString("es-AR");
}

// FILTROS DESPLEGABLE
function renderFiltros() {
  const tipos = [...new Set(catalogo.map(p => p.tipo).filter(t => t))].sort();
  const dd = document.getElementById("filtros-dropdown");
  let html = '<button data-tipo="" class="' + (filtroTipo === "" ? "activo" : "") + '">Todos los productos</button>';
  for (const t of tipos) {
    html += `<button data-tipo="${t}" class="${filtroTipo === t ? "activo" : ""}">${t}</button>`;
  }
  dd.innerHTML = html;
  dd.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      filtroTipo = btn.dataset.tipo;
      document.getElementById("filtro-activo-txt").textContent = filtroTipo ? `(${filtroTipo})` : "";
      document.getElementById("btn-filtros").classList.toggle("activo-tipo", !!filtroTipo);
      dd.classList.remove("abierto");
      renderFiltros();
      render();
    });
  });
}

document.getElementById("btn-filtros").addEventListener("click", (e) => {
  e.stopPropagation();
  document.getElementById("filtros-dropdown").classList.toggle("abierto");
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".filtros-pos")) {
    document.getElementById("filtros-dropdown").classList.remove("abierto");
  }
});

// CARRITO
function guardarCarrito() {
  localStorage.setItem('carrito', JSON.stringify(carrito));
  actualizarBadgeCarrito();
}
function actualizarBadgeCarrito() {
  const badge = document.getElementById("carrito-badge");
  const total = carrito.reduce((s, i) => s + i.cantidad, 0);
  if (total > 0) {
    badge.textContent = total;
    badge.style.display = "flex";
  } else {
    badge.style.display = "none";
  }
}
function agregarAlCarrito(idx) {
  const prod = catalogo[idx];
  const existe = carrito.find(i => i.producto === prod.producto && i.precio_venta === prod.precio_venta);
  if (existe) {
    existe.cantidad += 1;
  } else {
    carrito.push({ producto: prod.producto, precio_venta: prod.precio_venta, imagen: prod.imagen, cantidad: 1 });
  }
  guardarCarrito();
  renderCarrito();
  render();
}
function quitarDelCarrito(idx) {
  carrito.splice(idx, 1);
  guardarCarrito();
  renderCarrito();
}
function renderCarrito() {
  const cont = document.getElementById("carrito-items");
  const totalEl = document.getElementById("carrito-total");
  const wsBtn = document.getElementById("carrito-ws");
  if (carrito.length === 0) {
    cont.innerHTML = '<div class="carrito-vacio">🛒<br>Tu carrito está vacío</div>';
    totalEl.textContent = "$0";
    wsBtn.style.opacity = ".5";
    wsBtn.style.pointerEvents = "none";
    return;
  }
  wsBtn.style.opacity = "1";
  wsBtn.style.pointerEvents = "auto";
  let total = 0;
  let itemsHTML = "";
  let mensajeWS = "Hola, quiero consultar por los siguientes productos:\n\n";
  carrito.forEach((item, idx) => {
    const subtotal = item.precio_venta * item.cantidad;
    total += subtotal;
    itemsHTML += `
      <div class="carrito-item">
        <img src="${item.imagen}" alt="${item.producto}">
        <div class="detalle">
          <div class="det-nombre">${item.producto}</div>
          <div class="det-precio">${formatearPrecio(item.precio_venta)} × ${item.cantidad} = ${formatearPrecio(subtotal)}</div>
        </div>
        <button class="quitar" onclick="quitarDelCarrito(${idx})">×</button>
      </div>
    `;
    mensajeWS += `• ${item.producto} (${item.cantidad}x ${formatearPrecio(item.precio_venta)}) = ${formatearPrecio(subtotal)}\n`;
  });
  mensajeWS += `\n*Total: ${formatearPrecio(total)}*`;
  cont.innerHTML = itemsHTML;
  totalEl.textContent = formatearPrecio(total);
  wsBtn.href = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(mensajeWS)}`;
}
document.getElementById("btn-carrito").addEventListener("click", () => {
  document.getElementById("carrito-panel").classList.add("abierto");
  document.getElementById("overlay").classList.add("abierto");
});
document.getElementById("carrito-cerrar").addEventListener("click", cerrarCarrito);
document.getElementById("overlay").addEventListener("click", cerrarCarrito);
function cerrarCarrito() {
  document.getElementById("carrito-panel").classList.remove("abierto");
  document.getElementById("overlay").classList.remove("abierto");
}

// RENDER PRINCIPAL
function render() {
  const grid = document.getElementById("grid");
  const contador = document.getElementById("contador");
  const sinRes = document.getElementById("sin-resultados");

  let filtrados = catalogo.filter(p => {
    if (filtroTipo && p.tipo !== filtroTipo) return false;
    if (busqueda && !p.producto.toLowerCase().includes(busqueda)) return false;
    return true;
  });

  contador.textContent = `${filtrados.length} producto${filtrados.length === 1 ? '' : 's'}`;

  if (filtrados.length === 0) {
    grid.innerHTML = "";
    sinRes.style.display = "block";
    return;
  }
  sinRes.style.display = "none";

  grid.innerHTML = filtrados.map(p => {
    const idx = catalogo.indexOf(p);
    const mensaje = encodeURIComponent(`Hola, me interesa: ${p.producto} (${formatearPrecio(p.precio_venta)})`);
    const wsUrl = `https://wa.me/${WHATSAPP_NUMERO}?text=${mensaje}`;
    const enCarrito = carrito.some(i => i.producto === p.producto && i.precio_venta === p.precio_venta);
    return `
      <div class="producto">
        <div class="img-wrap" onclick="abrirLightbox(${idx})">
          <img src="${p.imagen || ''}" alt="${p.producto}" loading="lazy" onerror="this.style.opacity='0'">
        </div>
        <div class="info">
          <div class="nombre">${p.producto}</div>
          <div class="tipo">${p.tipo || 'general'}</div>
          <div class="precio">${formatearPrecio(p.precio_venta)}</div>
          <div class="acciones">
            <a href="${wsUrl}" target="_blank" rel="noopener" class="btn-ws">💬 Consultar</a>
            <button class="btn-agregar ${enCarrito ? 'agregado' : ''}" onclick="agregarAlCarrito(${idx})">${enCarrito ? '✓ En carrito' : '+ Carrito'}</button>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

// LIGHTBOX
function abrirLightbox(idx) {
  const p = catalogo[idx];
  document.getElementById("lb-img").src = p.imagen;
  document.getElementById("lb-nombre").textContent = p.producto;
  document.getElementById("lb-precio").textContent = formatearPrecio(p.precio_venta);
  document.getElementById("lb-desc").textContent = p.descripcion || "";
  document.getElementById("lightbox").classList.add("abierto");
}
document.getElementById("lb-cerrar").addEventListener("click", () => {
  document.getElementById("lightbox").classList.remove("abierto");
});
document.getElementById("lightbox").addEventListener("click", (e) => {
  if (e.target.id === "lightbox") {
    document.getElementById("lightbox").classList.remove("abierto");
  }
});

document.getElementById("buscar").addEventListener("input", e => {
  busqueda = e.target.value.toLowerCase().trim();
  render();
});

// CARGAR CATALOGO (con ?v= para evitar caché)
fetch("catalogo.json?v=" + Date.now())
  .then(r => r.json())
  .then(data => {
    catalogo = data;
    renderFiltros();
    render();
    renderCarrito();
    actualizarBadgeCarrito();
  })
  .catch(err => {
    document.getElementById("grid").innerHTML = `<div class="sin-resultados">Error al cargar el catálogo: ${err.message}</div>`;
  });
</script>
</body>
</html>
echo "web/index.html renovado con carrito, lightbox y modo oscuro"
